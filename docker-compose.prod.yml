name: nyaysetu-prod

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    environment:
      - NODE_ENV=production
    env_file:
      - .env.local
    depends_on:
      api:
        condition: service_healthy
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    env_file:
      - .env.local
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
