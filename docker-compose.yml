name: nyaysetu

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: nyaysetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nyaysetu"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fir-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fir-network
    restart: unless-stopped

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/nyaysetu
      NODE_ENV: development
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - fir-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "${WEB_PORT:-3001}:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: development
    command: >
      sh -c "pnpm --filter @nyaysetu/shared build &&
             pnpm --filter @nyaysetu/web exec next dev --turbopack --hostname 0.0.0.0"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    networks:
      - fir-network
    restart: unless-stopped

  nginx:
    build:
      context: docker/nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      - web
      - api
    networks:
      - fir-network
    restart: unless-stopped

networks:
  fir-network:
    driver: bridge

volumes:
  postgres_data:
  api_venv:
  web_node_modules:
